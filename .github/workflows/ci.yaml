# ──────────────────────────────────────────────────────────────
# LogiX CI Pipeline
#
# Runs on every push/PR to main, manual dispatch, and can be
# called by a separate build/publish workflow via workflow_call.
#
# SHA-pinning sources (all verified via web search 2026-11-19):
#   actions/checkout          v4.2.2  → 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-java        v4.9.1  → cf277c60eb25467037889841efdb72551f06f6c3
#   actions/setup-node        v4.4.0  → 49933ea5288caeca8642d1e84afbd3f7d6820020
#   actions/upload-artifact   v4.6.1  → 4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
#   actions/dependency-review v5.0.0  → a1d282b36b6f3519aa1f3fc636f609c47dddb294
#   gitleaks/gitleaks-action  v2.3.9  → ff98106e4c7b2bc287b24eaf42907196329070c8
#   aquasecurity/trivy-action v0.36.0 → ed142fd0673e97e23eac54620cfb913e5ce36c25
#     (NOTE: v0.33.1 was supply-chain-compromised in March 2026)
# ──────────────────────────────────────────────────────────────
name: LogiX CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════
jobs:

  # ─── 1. Backend build + test (matrix) ──────────────────────
  backend-build-test:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - order-service
          - inventory-service
          - warehouse-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Run Maven verification
        working-directory: ${{ matrix.service }}
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-hmac-sha256
          PASSWORD_ENCODING_PEPPER: ci-test-pepper-for-testing-only
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Zero-meaningful-test guard
        working-directory: ${{ matrix.service }}
        run: |
          count=$(grep -r --include='*.java' '@Test' src/test/ | wc -l)
          echo "::notice::${{ matrix.service }}: found $count @Test annotation(s)"
          if [ "$count" -le 1 ]; then
            echo "::error::${{ matrix.service }} has only $count @Test annotation(s) — only boilerplate contextLoads() found. Add real tests."
            exit 1
          fi

  # ─── 2. Frontend build ─────────────────────────────────────
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app-frontend/package-lock.json

      - name: Install dependencies
        working-directory: app-frontend
        run: npm ci

      - name: Build frontend
        working-directory: app-frontend
        run: npm run build

      - name: Warn about missing test and lint scripts
        run: |
          echo "::warning file=app-frontend/package.json::No 'test' or 'lint' scripts defined. Frontend code is not tested or linted in CI."

  # ─── 3. Source security ────────────────────────────────────
  source-security:
    name: Secret and dependency scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c8 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --redact --verbose

      - name: Scan source and dependency manifests with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  # ─── 4. Docker build (no push) ─────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.component }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        component:
          - auth-service
          - order-service
          - inventory-service
          - warehouse-service
          - app-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image (no push)
        working-directory: ${{ matrix.component }}
        run: |
          docker build \
            --tag logix/${{ matrix.component }}:ci-${{ github.sha }} \
            .

  # ─── 5. Dependency review (PR only) ────────────────────────
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
